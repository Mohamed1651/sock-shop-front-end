version: '2'

services:
  edge-router:
    image: weaveworksdemos/edge-router
    ports:
      - '8001:80'
    hostname: edge-router
    restart: always
    environment:
      - reschedule:on-node-failure
  catalogue:
    image: weaveworksdemos/catalogue:0.3.5
    hostname: catalogue
    restart: always
    # No build context needed here
    environment:
      - DB_HOST=catalogue-db:3306
    ports:
      - "8081:80" # Avoid using 8080 if another service is using it
    depends_on:
      - catalogue-db

  catalogue-db:
    image: weaveworksdemos/catalogue-db:0.3.0
    hostname: catalogue-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=socksdb
  carts:
    build:
      context: ../../sock-shop-carts/target  # Path to the folder you cloned
      dockerfile: ../docker/carts/Dockerfile
    hostname: carts
    restart: always
    environment:
      - MONGO_HOST=carts-db:27017
      - reschedule:on-node-failure
  carts-db:
    image: mongo:3.4
    hostname: carts-db
    restart: always
    environment:
      - reschedule:on-node-failure

  #  orders:
  #    image: weaveworksdemos/orders
  #    hostname: orders
  #    restart: always
  #    environment:
  #      - reschedule:on-node-failure

  orders:
    build:
      context: ../../sock-shop-orders/target  # Path to the folder you cloned
      dockerfile: ../docker/orders/Dockerfile
    hostname: orders
    restart: always
    environment:
      - MONGO_HOST=orders-db:27017
    depends_on:
      - orders-db

  orders-db:
    image: mongo:3.4
    hostname: orders-db
    restart: always
    environment:
      - reschedule:on-node-failure
  shipping:
    build:
      context: ../../sock-shop-shipping/target  # Path to the folder you cloned
      dockerfile: ../docker/shipping/Dockerfile
    hostname: shipping
    restart: always
    environment:
      - reschedule:on-node-failure

  queue-master:
    build:
      context: ../../sock-shop-queue-master/target
      dockerfile: ../docker/queue-master/Dockerfile
    hostname: queue-master
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    environment:
      - reschedule:on-node-failure

  rabbitmq:
    image: rabbitmq:3
    hostname: rabbitmq
    restart: always
    environment:
      - reschedule:on-node-failure
  payment:
    image: weaveworksdemos/payment
    hostname: payment
    restart: always
    environment:
      - reschedule:on-node-failure
    entrypoint:
      - /app
    command:
      - -port=80
      - -decline=999
  user:
    image: weaveworksdemos/user:0.4.4  # Use the pre-built stable image
    hostname: user
    restart: always
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - MONGO_HOST=user-db:27017
    ports:
      - "8083:80"
    depends_on:
      - user-db

  user-db:
    build:
      context: ./docker/user-db/
    hostname: user-db
    restart: always
    # Removed read_only and cap_drop to allow MongoDB to start
    environment:
      - reschedule=on-node-failure
    ports:
      - "27017:27017"

  front-end:
    image: weaveworksdemos/front-end
    hostname: front-end
    restart: always
    depends_on:
      - user
      - catalogue
      - carts